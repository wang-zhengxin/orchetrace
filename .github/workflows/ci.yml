name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: TypeScript and Web
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Run Adapter and Web tests
        run: npm run check

  rust:
    name: Rust and Tauri
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: clippy, rustfmt

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2

      - name: Prepare desktop frontend
        run: npm run desktop:prepare

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --locked

      - name: Check desktop shell
        run: npm run desktop:check

  distribution:
    name: Linux CLI and npm package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          key: distribution-linux-x64

      - name: Build and verify portable CLI bundle
        run: node scripts/build-cli-bundle.mjs --target x86_64-unknown-linux-gnu --version 0.1.0-ci.0

      - name: Pack and verify npm packages
        run: node scripts/stage-npm-packages.mjs --target x86_64-unknown-linux-gnu --bundle dist/cli/x86_64-unknown-linux-gnu/orchetrace --version 0.1.0-ci.0
