name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate semantic version used for artifacts and baseline selection
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            platform: macos-15
            target: aarch64-apple-darwin
          - label: macOS Intel
            platform: macos-15-intel
            target: x86_64-apple-darwin
          - label: Linux x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - label: Windows x64
            platform: windows-2022
            target: x86_64-pc-windows-msvc

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Tauri Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xauth \
            xvfb \
            xdg-utils

      - name: Set up official Node.js runtime
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Expose portable Node.js binary
        shell: bash
        env:
          ORCHETRACE_PREVIEW_VERSION: ${{ inputs.version }}
        run: |
          node -e "require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'ORCHETRACE_RELEASE_NODE=' + process.execPath + '\n')"
          node scripts/release-context.mjs

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: release-${{ matrix.target }}

      - name: Test workspace
        run: |
          npm run check
          npm run desktop:prepare
          cargo test --workspace --locked

      - name: Prepare bundled sidecars and adapters
        run: node scripts/prepare-release.mjs --target ${{ matrix.target }}

      - name: Verify prepared runtime
        run: node scripts/verify-release.mjs --target ${{ matrix.target }}

      - name: Build portable CLI and npm packages
        run: |
          node scripts/build-cli-bundle.mjs --target ${{ matrix.target }} --version ${{ env.ORCHETRACE_RELEASE_VERSION }} --skip-build
          node scripts/stage-npm-packages.mjs --target ${{ matrix.target }} --bundle dist/cli/${{ matrix.target }}/orchetrace --version ${{ env.ORCHETRACE_RELEASE_VERSION }}

      - name: Verify install, upgrade, rollback, and uninstall
        run: node scripts/smoke-install-lifecycle.mjs --target ${{ matrix.target }} --bundle dist/cli/${{ matrix.target }}/orchetrace --version ${{ env.ORCHETRACE_RELEASE_VERSION }}

      - name: Preserve distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: distribution-${{ matrix.target }}
          if-no-files-found: error
          path: |
            dist/cli/artifacts/
            dist/npm/tarballs/

      - name: Build installers and create draft release
        if: github.ref_type == 'tag'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos-') && '-' || '' }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "Orchetrace v__VERSION__ Beta"
          releaseBody: |
            Beta desktop build for Claude Code, Codex, Pi, DeepSeek Harness, and Google Antigravity observability.

            This draft is intentionally unpublished until installation and upgrade smoke tests pass.
          releaseDraft: true
          prerelease: true
          args: --ci --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json

      - name: Build preview installers without creating a release
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v1
        env:
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos-') && '-' || '' }}
        with:
          projectPath: apps/desktop
          args: --ci --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json

      - name: Verify final desktop installer contents
        run: node scripts/verify-desktop-artifact.mjs --target ${{ matrix.target }} --bundle-root target/${{ matrix.target }}/release/bundle

      - name: Verify isolated desktop launch
        run: node scripts/smoke-desktop-launch.mjs --target ${{ matrix.target }} --bundle-root target/${{ matrix.target }}/release/bundle

      - name: Preserve verified desktop installers
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.target }}
          if-no-files-found: error
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/msi/*.msi

  homebrew:
    name: Homebrew installation lifecycle
    needs: desktop
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up official Node.js runtime
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Resolve release context
        env:
          ORCHETRACE_PREVIEW_VERSION: ${{ inputs.version }}
        run: node scripts/release-context.mjs

      - name: Download macOS CLI bundles
        uses: actions/download-artifact@v8
        with:
          pattern: distribution-*-apple-darwin
          path: dist/homebrew-assets
          merge-multiple: true

      - name: Download macOS desktop installers
        uses: actions/download-artifact@v8
        with:
          pattern: installer-*-apple-darwin
          path: dist/homebrew-assets
          merge-multiple: true

      - name: Generate and style Homebrew definitions
        run: |
          node scripts/generate-homebrew.mjs --version "$ORCHETRACE_RELEASE_VERSION" --assets-dir dist/homebrew-assets --output dist/homebrew --require-cask
          brew style dist/homebrew/Formula/orchetrace.rb dist/homebrew/Casks/orchetrace.rb

      - name: Download previous Cask baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/download-desktop-baseline.mjs --repository "${{ github.repository }}" --current-tag "$ORCHETRACE_CURRENT_TAG" --target aarch64-apple-darwin --output dist/homebrew-baseline

      - name: Verify Homebrew Formula and Cask installation
        run: node scripts/smoke-homebrew-lifecycle.mjs --version "$ORCHETRACE_RELEASE_VERSION" --assets-dir dist/homebrew-assets --definitions-dir dist/homebrew --baseline-root dist/homebrew-baseline

  desktop-version-lifecycle:
    name: ${{ matrix.label }} version lifecycle
    needs: desktop
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            platform: macos-15
            target: aarch64-apple-darwin
          - label: macOS Intel
            platform: macos-15-intel
            target: x86_64-apple-darwin
          - label: Linux x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - label: Windows x64
            platform: windows-2022
            target: x86_64-pc-windows-msvc
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Linux desktop runtime dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-0 \
            libayatana-appindicator3-1 \
            librsvg2-2 \
            xauth \
            xvfb

      - name: Set up official Node.js runtime
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Resolve release context
        env:
          ORCHETRACE_PREVIEW_VERSION: ${{ inputs.version }}
        run: node scripts/release-context.mjs

      - name: Download candidate installer
        uses: actions/download-artifact@v8
        with:
          name: installer-${{ matrix.target }}
          path: dist/desktop-candidate

      - name: Download latest compatible release baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/download-desktop-baseline.mjs --repository "${{ github.repository }}" --current-tag "$ORCHETRACE_CURRENT_TAG" --target "${{ matrix.target }}" --output dist/desktop-baseline

      - name: Verify baseline, candidate, rollback, and shared data
        run: node scripts/smoke-desktop-version-lifecycle.mjs --target "${{ matrix.target }}" --baseline-root dist/desktop-baseline --candidate-root dist/desktop-candidate

  distribution:
    name: Assemble release candidate
    needs: [desktop, homebrew, desktop-version-lifecycle]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up official Node.js runtime
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Resolve release version
        env:
          ORCHETRACE_PREVIEW_VERSION: ${{ inputs.version }}
        run: node scripts/release-context.mjs

      - name: Download CLI and npm artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: distribution-*
          path: dist/distribution
          merge-multiple: true

      - name: Upload portable CLI bundles to draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/distribution/cli/artifacts/*.tar.gz dist/distribution/cli/artifacts/*.sha256 --clobber

      - name: Download verified desktop installers
        uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          path: dist/distribution/installers
          merge-multiple: true

      - name: Generate Homebrew Formula and Cask
        run: node scripts/generate-homebrew.mjs --version "$ORCHETRACE_RELEASE_VERSION" --assets-dir dist/distribution --output dist/homebrew --require-cask

      - name: Stage main npm package
        run: node scripts/stage-npm-packages.mjs --version "$ORCHETRACE_RELEASE_VERSION" --output dist/npm-main

      - name: Generate validated candidate summary
        run: node scripts/summarize-release-candidate.mjs --version "$ORCHETRACE_RELEASE_VERSION" --mode "$ORCHETRACE_RELEASE_MODE" --assets-dir dist --output dist/release-summary

      - name: Preserve complete release candidate
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/release-summary/
            dist/distribution/
            dist/homebrew/
            dist/npm-main/tarballs/

      - name: Publish npm beta packages with provenance
        if: github.ref_type == 'tag' && vars.NPM_PUBLISH == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: node scripts/publish-npm.mjs --version "$ORCHETRACE_RELEASE_VERSION" --platform-dir dist/distribution/npm/tarballs --main-dir dist/npm-main/tarballs --tag beta

      - name: Check out Homebrew tap
        if: github.ref_type == 'tag' && vars.HOMEBREW_PUBLISH == 'true'
        uses: actions/checkout@v6
        with:
          repository: wang-zhengxin/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: dist/homebrew-tap

      - name: Update Homebrew tap
        if: github.ref_type == 'tag' && vars.HOMEBREW_PUBLISH == 'true'
        working-directory: dist/homebrew-tap
        run: |
          mkdir -p Formula Casks
          cp ../homebrew/Formula/orchetrace.rb Formula/orchetrace.rb
          cp ../homebrew/Casks/orchetrace.rb Casks/orchetrace.rb
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Formula/orchetrace.rb Casks/orchetrace.rb
          git diff --cached --quiet || git commit -m "orchetrace ${ORCHETRACE_RELEASE_VERSION}"
          git push
