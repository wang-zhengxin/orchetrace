[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/protocol",
  "crates/core",
  "crates/ingest",
  "crates/storage",
  "crates/cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
orchetrace-protocol = { path = "crates/protocol" }
orchetrace-core = { path = "crates/core" }
orchetrace-ingest = { path = "crates/ingest" }
orchetrace-storage = { path = "crates/storage" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
